name: Deploy
on:
    push:
        tags:
            - "v*-Release"
jobs:
    # Runs first: every other job waits for it, so a release whose tag doesn't
    # match package.json never gets built or deployed.
    check-version:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: package.json
                  sparse-checkout-cone-mode: false
            - name: Check package.json version matches the release tag
              run: |
                  version=$(jq -r .version package.json)
                  tag="$GITHUB_REF_NAME"
                  if [ "$tag" = "v$version" ]; then
                      echo "package.json version $version matches release tag $tag."
                      exit 0
                  fi

                  reason="The release tag is \"$tag\", but package.json says the version is \"$version\" (which needs the tag \"v$version\"). Deploy blocked so the site isn't released with the wrong version."
                  steps="To fix it:
                  1. Delete the GitHub release \"$tag\" (Releases page > the release > Delete).
                  2. Delete its tag too, since deleting a release keeps the tag: git push --delete origin $tag (and git tag -d $tag locally).
                  3. Fix \"version\" in package.json to the version you're releasing, then commit and push. The tag must be \"v\" followed by exactly that version.
                  4. Re-create the release and its tag."

                  # Annotations need newlines encoded as %0A.
                  echo "::error title=package.json version doesn't match the release tag::$reason%0A%0A${steps//$'\n'/%0A}"
                  printf '## Deploy blocked: version mismatch\n\n%s\n\n%s\n' "$reason" "$steps" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
    sentry-sourcemaps:
        needs: check-version
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - name: installs pnpm
          uses: pnpm/action-setup@v6
        - uses: actions/setup-node@v7
          with:
            node-version: '22.14.0'
            cache: 'pnpm'
        - name: dependencies
          run: pnpm i
        - name: settings
          run: cp settings.example.json settings.json
        - name: run sentry:build
          run: pnpm run sentry:build
        - name: run sentry:sourcemaps
          run: pnpm run sentry:sourcemaps
          env:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    build:
        needs: check-version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: 'Login to GitHub Container Registry'
              uses: docker/login-action@v4
              with:
                registry: ${{secrets.DOCKER_URL}}
                username: ${{secrets.DOCKER_USER}}
                password: ${{secrets.DOCKER_PASSWORD}}
            - name: Build
              run: docker build -t ${{secrets.DOCKER_URL}}/del/website:${GITHUB_REF#refs/tags/} .
            - name: Push
              run: docker push ${{secrets.DOCKER_URL}}/del/website:${GITHUB_REF#refs/tags/}
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Login
              run: |
                  mkdir ~/.kube
                  echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
            - name: Set image
              run: kubectl set image deployment/site site=${{secrets.DOCKER_URL}}/del/website:${GITHUB_REF#refs/tags/}
            - name: Rollout status
              run: kubectl rollout status deployment/site
